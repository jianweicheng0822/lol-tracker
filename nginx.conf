# The site is behind Cloudflare, so every request arrives from a Cloudflare server. Take the
# visitor's IP from CF-Connecting-IP, but only when the request really comes from Cloudflare
# (ranges from https://www.cloudflare.com/ips/), so the header can't be spoofed by connecting
# directly. The backend's per-IP rate limits (login, register) depend on this.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# Per-visitor limit on the API: 10 requests/second on average, bursts of 50 allowed (opening a
# player page sends about 8). Stops scripts from draining the Riot API quota for everyone.
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
limit_req_status 429;

server {
    listen 80 default_server;
    server_name _;
    return 301 https://loltracker.lol$request_uri;
}

server {
    listen 80;
    server_name loltracker.lol;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # script-src keeps 'unsafe-inline' only for Cloudflare: its bot detection (JavaScript
    # Detections) injects an inline <script> whose contents change on every request, so it can't be
    # allowed by hash. The app itself ships no inline scripts, and React escapes rendered content.
    # style-src needs it for React's inline style attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://static.cloudflareinsights.com; img-src 'self' https://ddragon.leagueoflegends.com https://raw.communitydragon.org; style-src 'self' 'unsafe-inline'; connect-src 'self' https://cloudflareinsights.com https://ddragon.leagueoflegends.com https://raw.communitydragon.org; font-src 'self'" always;

    location /api/ {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://lol-tracker:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://lol-tracker:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # SSE streaming for AI analysis — disable buffering so tokens arrive in real time
    location /api/analyze/stream {
        limit_req zone=api burst=50 nodelay;
        proxy_pass http://lol-tracker:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 120s;
    }
}
